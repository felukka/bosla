---
site_name: Bosla Docs
site_description: A serious, well-scoped versioning tool
site_url: https://bosla.felukka.org
repo_url: https://github.com/felukka/bosla
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - Getting started:
      - Prerequisites: getting-started/prerequisites.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Commands:
      - Overview: commands/overview.md
      - Configure: commands/configure.md
      - Project: commands/project.md
      - Service: commands/service.md
      - Release: commands/release.md
  - Reference:
      - Data model: reference/data-model.md
      - Configuration: reference/configuration.md
      - FAQ: reference/faq.md
theme:
  name: material
  icon:
    repo: fontawesome/brands/git-alt
  # TODO: Replace with real logos
  logo: assets/bosla.svg
  favicon: assets/bosla.svg
  font:
    text: Manrope
    code: JetBrains Mono
  features:
    - navigation.footer
    - search.highlight
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - content.tabs.link
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Dark mode
extra_css:
  - stylesheets/felukka.css
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
copyright: Copyright &copy; 2026 Felukka.org
